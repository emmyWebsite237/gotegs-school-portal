<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz | Go-Tegs International School</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .quiz-card {
      border: 1px solid var(--border);
      border-left: 3px solid var(--maroon);
      border-radius: 0 var(--radius) var(--radius) 0;
      background: var(--paper);
      padding: 1.75rem;
      margin-top: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    .quiz-meta {
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--font-display); font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--maroon-dark);
      margin-bottom: 0.4rem;
    }

    .quiz-progress { height: 5px; border-radius: 99px; background: var(--cream); overflow: hidden; margin-bottom: 1.4rem; }
    .quiz-progress span { display: block; height: 100%; background: var(--gold); transition: width 0.25s ease; }

    .quiz-question { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; line-height: 1.45; margin-bottom: 1.2rem; }

    .quiz-options { display: flex; flex-direction: column; gap: 0.6rem; }

    .quiz-option {
      display: flex; align-items: center; gap: 0.75rem; width: 100%;
      padding: 0.85rem 1rem; text-align: left;
      border: 1px solid var(--border); border-radius: 9px; background: var(--paper);
      font-family: var(--font-body); font-size: 0.95rem; color: var(--ink);
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .quiz-option:hover:not(:disabled) { border-color: var(--maroon); background: var(--cream); }
    .quiz-option .key {
      flex-shrink: 0; height: 26px; width: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--cream); color: var(--maroon-dark);
      font-family: var(--font-display); font-weight: 700; font-size: 0.78rem;
    }
    .quiz-option.correct { border-color: #1f7a45; background: #eefaf2; }
    .quiz-option.correct .key { background: #1f7a45; color: #fff; }
    .quiz-option.wrong { border-color: #b3261e; background: #fdeeed; }
    .quiz-option.wrong .key { background: #b3261e; color: #fff; }
    .quiz-option:disabled { cursor: default; }

    .quiz-feedback {
      margin-top: 1.1rem; padding: 0.9rem 1.1rem; border-radius: 0 8px 8px 0;
      background: var(--cream); border-left: 3px solid var(--gold);
      font-size: 0.9rem; color: var(--ink); display: none;
    }
    .quiz-feedback strong { font-family: var(--font-display); }

    .quiz-actions { margin-top: 1.4rem; display: flex; gap: 0.6rem; flex-wrap: wrap; }

    .score-ring {
      font-family: var(--font-display); font-size: 2.6rem; font-weight: 800;
      color: var(--maroon); line-height: 1; margin-bottom: 0.3rem;
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="page-container">
    <nav class="breadcrumb">Home / Quiz</nav>
    <h1>Quiz</h1>
    <p>Pick a topic below to test yourself. You'll see the correct answer and a short explanation after each question.</p>

    <!-- Topic picker -->
    <ul class="link-grid" id="topicList"></ul>

    <!-- Quiz area -->
    <div class="quiz-card" id="quizCard" style="display:none;">
      <div class="quiz-meta">
        <span id="quizTopic"></span>
        <span id="quizCount"></span>
      </div>
      <div class="quiz-progress"><span id="quizBar" style="width:0%"></span></div>

      <div id="quizBody">
        <p class="quiz-question" id="quizQuestion"></p>
        <div class="quiz-options" id="quizOptions"></div>
        <div class="quiz-feedback" id="quizFeedback"></div>
        <div class="quiz-actions">
          <button class="btn" id="nextBtn" style="display:none;">Next Question</button>
          <button class="btn-save" id="quitBtn">Back to Topics</button>
        </div>
      </div>

      <div id="quizResult" style="display:none; text-align:center; padding:1rem 0;">
        <div class="score-ring" id="scoreText"></div>
        <p id="scoreMessage"></p>
        <div class="quiz-actions" style="justify-content:center;">
          <button class="btn" id="retryBtn">Try Again</button>
          <button class="btn-save" id="backBtn">Back to Topics</button>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="/assets/js/main.js"></script>
  <script>
  /* ======================================================================
     EDIT YOUR QUIZZES HERE
     ----------------------------------------------------------------------
     Add a topic by copying one block. For each question:
       q       - the question text
       options - the answer choices, in order
       answer  - index of the correct option (0 = first, 1 = second, ...)
       why     - short explanation shown after answering
     ====================================================================== */
  const QUIZZES = {
    "Mathematics": [
      { q: "What is 15% of 200?", options: ["20", "30", "35", "40"], answer: 1,
        why: "10% of 200 is 20, and 5% is 10. 20 + 10 = 30." },
      { q: "A triangle's angles add up to how many degrees?", options: ["90°", "180°", "270°", "360°"], answer: 1,
        why: "The interior angles of any triangle always sum to 180°." },
      { q: "Solve for x: 3x + 6 = 21", options: ["3", "5", "7", "9"], answer: 1,
        why: "Subtract 6 from both sides to get 3x = 15, then divide by 3, so x = 5." }
    ],

    "Basic Science": [
      { q: "Which gas do plants take in during photosynthesis?", options: ["Oxygen", "Nitrogen", "Carbon dioxide", "Hydrogen"], answer: 2,
        why: "Plants absorb carbon dioxide and release oxygen during photosynthesis." },
      { q: "What is the boiling point of water at sea level?", options: ["50°C", "90°C", "100°C", "120°C"], answer: 2,
        why: "At standard atmospheric pressure, water boils at 100°C." },
      { q: "Which organ pumps blood around the body?", options: ["Liver", "Heart", "Lungs", "Kidney"], answer: 1,
        why: "The heart pumps blood through the circulatory system." }
    ],

    "English Language": [
      { q: "Which word is a synonym of 'rapid'?", options: ["Slow", "Quick", "Heavy", "Quiet"], answer: 1,
        why: "'Rapid' and 'quick' both describe something happening fast." },
      { q: "Choose the correctly spelled word.", options: ["Recieve", "Receive", "Receeve", "Reciev"], answer: 1,
        why: "The rule is 'i before e except after c' — so it's 'receive'." },
      { q: "What is the plural of 'child'?", options: ["Childs", "Childes", "Children", "Childrens"], answer: 2,
        why: "'Child' has an irregular plural form: 'children'." }
    ]
  };
  /* ==================== END OF EDITABLE SECTION ==================== */

  let topic = null, questions = [], index = 0, score = 0, answered = false;

  const el = (id) => document.getElementById(id);

  function renderTopics() {
    el("topicList").innerHTML = Object.keys(QUIZZES)
      .map((name) => `<li><a href="#" data-topic="${name}">${name} &middot; ${QUIZZES[name].length} questions</a></li>`)
      .join("");

    el("topicList").querySelectorAll("a").forEach((a) => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        startQuiz(a.dataset.topic);
      });
    });
  }

  function startQuiz(name) {
    topic = name;
    questions = QUIZZES[name];
    index = 0;
    score = 0;
    el("topicList").style.display = "none";
    el("quizCard").style.display = "block";
    el("quizBody").style.display = "block";
    el("quizResult").style.display = "none";
    el("quizTopic").textContent = name;
    showQuestion();
  }

  function showQuestion() {
    answered = false;
    const item = questions[index];

    el("quizCount").textContent = `Question ${index + 1} of ${questions.length}`;
    el("quizBar").style.width = `${(index / questions.length) * 100}%`;
    el("quizQuestion").textContent = item.q;
    el("quizFeedback").style.display = "none";
    el("nextBtn").style.display = "none";

    el("quizOptions").innerHTML = item.options
      .map((opt, i) => `
        <button type="button" class="quiz-option" data-i="${i}">
          <span class="key">${String.fromCharCode(65 + i)}</span>
          <span>${opt}</span>
        </button>`)
      .join("");

    el("quizOptions").querySelectorAll(".quiz-option").forEach((btn) => {
      btn.addEventListener("click", () => selectAnswer(Number(btn.dataset.i)));
    });
  }

  function selectAnswer(choice) {
    if (answered) return;
    answered = true;

    const item = questions[index];
    const buttons = el("quizOptions").querySelectorAll(".quiz-option");

    buttons.forEach((btn, i) => {
      btn.disabled = true;
      if (i === item.answer) btn.classList.add("correct");
      else if (i === choice) btn.classList.add("wrong");
    });

    if (choice === item.answer) score++;

    const fb = el("quizFeedback");
    fb.innerHTML = `<strong>${choice === item.answer ? "Correct." : "Not quite."}</strong> ${item.why}`;
    fb.style.display = "block";

    el("nextBtn").textContent = index === questions.length - 1 ? "See My Score" : "Next Question";
    el("nextBtn").style.display = "inline-flex";
  }

  function finish() {
    const pct = Math.round((score / questions.length) * 100);
    el("quizBody").style.display = "none";
    el("quizResult").style.display = "block";
    el("quizBar").style.width = "100%";
    el("quizCount").textContent = "Completed";
    el("scoreText").textContent = `${score} / ${questions.length}`;

    let note;
    if (pct === 100) note = "A perfect score. Excellent work.";
    else if (pct >= 70) note = "Well done — a strong result.";
    else if (pct >= 50) note = "A fair attempt. Review the ones you missed and try again.";
    else note = "Keep practising. Go over the topic and give it another go.";
    el("scoreMessage").textContent = `${pct}% — ${note}`;
  }

  function backToTopics() {
    el("quizCard").style.display = "none";
    el("topicList").style.display = "grid";
  }

  el("nextBtn").addEventListener("click", () => {
    if (index === questions.length - 1) { finish(); return; }
    index++;
    showQuestion();
  });

  el("quitBtn").addEventListener("click", backToTopics);
  el("backBtn").addEventListener("click", backToTopics);
  el("retryBtn").addEventListener("click", () => startQuiz(topic));

  renderTopics();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Quiz Codes | Admin | Go-Tegs</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
  <style>
    .qc-wrap{display:grid;gap:1.25rem}
    .qc-form,.qc-editor{padding:1.35rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--paper);box-shadow:0 10px 30px rgba(16,36,60,.05)}
    .qc-form label,.qc-editor label{font-family:var(--font-display);font-weight:700;font-size:.82rem;display:block;margin-top:.75rem}
    .qc-form input,.qc-form select,.qc-editor input,.qc-editor select{width:100%;font-size:.9rem;padding:.62rem .72rem;border:1px solid var(--border);border-radius:10px;margin-top:.35rem;box-sizing:border-box;background:#fff;color:inherit}
    .qc-settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem}
    .qc-question-block{border:1px solid var(--border);border-radius:16px;padding:1rem;margin-top:.85rem;background:#f8fbff}
    .qc-option-row{display:flex;align-items:center;gap:.55rem;margin-top:.5rem}.qc-option-row input[type=text]{flex:1;margin:0}
    .qc-remove-q,.qc-link-btn{background:none;border:0;color:#b42318;font-size:.8rem;cursor:pointer;margin-top:.55rem;font-weight:700}
    .qc-list-item{border:1px solid var(--border);border-radius:16px;padding:1rem 1.15rem;margin-top:.75rem;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:.9rem;flex-wrap:wrap}
    .qc-list-main{display:grid;gap:.35rem;min-width:0}.qc-code-tag{font-family:var(--font-display);font-weight:800;font-size:1.05rem;background:var(--teal-light);color:var(--teal-dark);padding:.28rem .68rem;border-radius:9px;letter-spacing:.05em;display:inline-block}
    .qc-list-meta{font-size:.8rem;color:var(--slate)}
    .qc-actions{display:flex;gap:.5rem;flex-wrap:wrap}.qc-actions button{border:0;border-radius:10px;padding:.58rem .8rem;font-weight:800;cursor:pointer}.qc-edit-btn{background:#0f63c9;color:#fff}.qc-delete-btn{background:#fdeeee;color:#b42318}.qc-copy-btn{background:#eef6ff;color:#155eaa}
    .qc-editor{display:none;margin-top:1rem;background:linear-gradient(180deg,#fbfdff,#f3f8ff)}
    .qc-editor-head{display:flex;justify-content:space-between;align-items:center;gap:1rem}.qc-editor-head h2{margin:0}
    .qc-editor-code{font-family:var(--font-display);font-weight:900;letter-spacing:.08em;color:#0f63c9}
    .qc-editor-actions{display:flex;justify-content:flex-end;gap:.6rem;flex-wrap:wrap;margin-top:1rem}.qc-editor-actions button{border:0;border-radius:10px;padding:.7rem 1rem;font-weight:800;cursor:pointer}.qc-cancel{background:#eef1f4;color:#203040}.qc-save{background:#0f63c9;color:#fff}
    .qc-status{min-height:1.1rem;font-size:.85rem;font-weight:700}
    .qc-empty{padding:1rem;border:1px dashed var(--border);border-radius:14px;color:var(--slate)}
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <main class="page-container admin-page" style="max-width:1000px;">
    <nav class="breadcrumb">Admin / Quiz Codes</nav>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;">
      <div><h1>Manage Quiz Codes</h1><p>Create, edit or delete generated tests. Past attempts are kept when a test is edited.</p></div>
    </div>

    <div class="qc-wrap">
      <form class="qc-form" id="qcForm">
        <h2 style="margin-top:0">Create a new test</h2>
        <label for="qTitle">Quiz Title</label>
        <input type="text" id="qTitle" placeholder="e.g. Mid-Term Mathematics Practice" required />
        <div class="qc-settings-grid">
          <div><label for="qClass">Restrict to Class (optional)</label><input type="text" id="qClass" placeholder="e.g. JSS 1 (leave blank for any)" /></div>
          <div><label for="qTimeLimit">Time Limit (minutes, optional)</label><input type="number" id="qTimeLimit" min="1" placeholder="No limit" /></div>
          <div><label for="qAttempts">Attempts Allowed</label><input type="number" id="qAttempts" min="1" value="1" /></div>
          <div><label for="qShowAnswers">Show Answers After Submitting?</label><select id="qShowAnswers"><option value="true">Yes</option><option value="false">No</option></select></div>
          <div><label for="qExpires">Expiry (optional)</label><input type="datetime-local" id="qExpires" /></div>
        </div>
        <h3 style="margin-top:1.5rem;">Questions</h3>
        <div id="questionsContainer"></div>
        <button type="button" class="btn-save" id="addQuestionBtn" style="margin-top:1rem;">+ Add Question</button>
        <button type="submit" class="btn" id="createBtn" style="margin-top:1.5rem;">Create Quiz &amp; Generate Code</button>
        <p id="qcMsg" class="qc-status"></p>
      </form>

      <section class="qc-editor" id="editEditor" aria-hidden="true">
        <div class="qc-editor-head">
          <div><h2>Edit generated test</h2><p style="margin:.25rem 0 0;color:var(--slate);">Code <span class="qc-editor-code" id="editCode"></span> stays the same for students.</p></div>
          <button class="qc-cancel" id="closeEditBtn" type="button">Close</button>
        </div>
        <form id="editForm">
          <input type="hidden" id="editId" />
          <label for="editTitle">Quiz Title</label><input type="text" id="editTitle" required />
          <div class="qc-settings-grid">
            <div><label for="editClass">Restrict to Class</label><input type="text" id="editClass" /></div>
            <div><label for="editTime">Time Limit (minutes)</label><input type="number" id="editTime" min="1" /></div>
            <div><label for="editAttempts">Attempts Allowed</label><input type="number" id="editAttempts" min="1" required /></div>
            <div><label for="editShowAnswers">Show Answers After Submitting?</label><select id="editShowAnswers"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div><label for="editExpires">Expiry</label><input type="datetime-local" id="editExpires" /></div>
          </div>
          <h3 style="margin-top:1.5rem;">Questions</h3>
          <div id="editQuestionsContainer"></div>
          <button type="button" class="btn-save" id="addEditQuestionBtn" style="margin-top:1rem;">+ Add Question</button>
          <div class="qc-editor-actions"><button type="button" class="qc-cancel" id="cancelEditBtn">Cancel</button><button type="submit" class="qc-save" id="saveEditBtn">Save test changes</button></div>
          <p id="editMsg" class="qc-status"></p>
        </form>
      </section>

      <section>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;"><h2 style="margin-bottom:.4rem;">Existing Quiz Codes</h2><span id="quizCountLabel" class="qc-list-meta"></span></div>
        <div id="quizList"><p class="qc-empty">Loading tests…</p></div>
      </section>
    </div>
  </main>
  <div id="footer-placeholder"></div>
  <script src="/assets/js/main.js"></script>
  <script>
    const el = (id) => document.getElementById(id);
    const authHeaders = () => { const t = sessionStorage.getItem('gotegs_admin_token'); return t ? { Authorization: 'Bearer ' + t } : {}; };
    let createQuestionCount = 0, editQuestionCount = 0;

    function optionValue(block, cls){ return block.querySelector(cls)?.value.trim() || ''; }
    function addQuestionBlock(container, mode, q = null){
      const isEdit = mode === 'edit';
      const id = isEdit ? (++editQuestionCount) : (++createQuestionCount);
      const block = document.createElement('div'); block.className='qc-question-block'; block.dataset.id=id;
      const prefix = isEdit ? 'edit-' : '';
      block.innerHTML = `
        <label>Question <span class="question-label">${id}</span></label>
        <input type="text" class="q-text" placeholder="Question text" required value="${escapeAttr(q?.question || '')}" />
        <div class="qc-option-row"><input type="radio" name="${prefix}correct-${id}" value="a" ${(q?.correct_option || 'a')==='a'?'checked':''} /><input type="text" class="q-opt-a" placeholder="Option A" required value="${escapeAttr(q?.option_a || '')}" /></div>
        <div class="qc-option-row"><input type="radio" name="${prefix}correct-${id}" value="b" ${(q?.correct_option || '')==='b'?'checked':''} /><input type="text" class="q-opt-b" placeholder="Option B" required value="${escapeAttr(q?.option_b || '')}" /></div>
        <div class="qc-option-row"><input type="radio" name="${prefix}correct-${id}" value="c" ${(q?.correct_option || '')==='c'?'checked':''} /><input type="text" class="q-opt-c" placeholder="Option C (optional)" value="${escapeAttr(q?.option_c || '')}" /></div>
        <div class="qc-option-row"><input type="radio" name="${prefix}correct-${id}" value="d" ${(q?.correct_option || '')==='d'?'checked':''} /><input type="text" class="q-opt-d" placeholder="Option D (optional)" value="${escapeAttr(q?.option_d || '')}" /></div>
        <button type="button" class="qc-remove-q">Remove this question</button>`;
      block.querySelector('.qc-remove-q').addEventListener('click',()=>block.remove());
      container.appendChild(block);
    }
    function escapeAttr(v){ return String(v ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function collectQuestions(container, mode){
      return [...container.querySelectorAll('.qc-question-block')].map(block => {
        const id=block.dataset.id; const p=mode==='edit'?'edit-':''; const correct=block.querySelector(`input[name="${p}correct-${id}"]:checked`);
        return {question:optionValue(block,'.q-text'), option_a:optionValue(block,'.q-opt-a'), option_b:optionValue(block,'.q-opt-b'), option_c:optionValue(block,'.q-opt-c')||null, option_d:optionValue(block,'.q-opt-d')||null, correct_option:correct?.value||null};
      });
    }
    function formPayload(container, mode, prefix){
      const qs=collectQuestions(container, mode); return {title:el(prefix+'Title').value.trim(),class_restriction:el(prefix+'Class').value.trim()||null,time_limit_minutes:el(prefix+'Time').value?Number(el(prefix+'Time').value):null,attempts_allowed:Number(el(prefix+'Attempts').value)||1,show_answers_after:el(prefix+'ShowAnswers').value==='true',expires_at:el(prefix+'Expires').value?new Date(el(prefix+'Expires').value).toISOString():null,questions:qs};
    }
    function toLocalInputValue(iso){ if(!iso) return ''; const d=new Date(iso); const pad=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }

    el('addQuestionBtn').addEventListener('click',()=>addQuestionBlock(el('questionsContainer'),'create'));
    addQuestionBlock(el('questionsContainer'),'create');

    el('qcForm').addEventListener('submit', async e=>{
      e.preventDefault(); const msg=el('qcMsg'), btn=el('createBtn'); const payload=formPayload(el('questionsContainer'),'create','q');
      if(!payload.questions.length){msg.style.color='#dc2626';msg.textContent='Add at least one question.';return;}
      if(payload.questions.some(q=>!q.question||!q.option_a||!q.option_b||!q.correct_option)){msg.style.color='#dc2626';msg.textContent='Every question needs text, options A and B, and a correct answer.';return;}
      btn.disabled=true;btn.textContent='Creating…';msg.textContent='';
      try{const res=await fetch('/api/create-quiz-code',{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify(payload)});const data=await res.json();if(!res.ok)throw new Error(data.error||'Failed to create quiz.');msg.style.color='#0f766e';msg.textContent=`Quiz created. Code: ${data.code}`;el('qcForm').reset();el('questionsContainer').innerHTML='';createQuestionCount=0;addQuestionBlock(el('questionsContainer'),'create');loadQuizzes();}
      catch(err){msg.style.color='#dc2626';msg.textContent=err.message;} finally{btn.disabled=false;btn.textContent='Create Quiz & Generate Code';}
    });

    async function loadQuizzes(){
      const list=el('quizList');list.innerHTML='<p class="qc-empty">Loading tests…</p>';
      try{const res=await fetch('/api/list-quiz-codes',{headers:authHeaders()});const data=await res.json();if(!res.ok)throw new Error(data.error||'Could not load tests.');el('quizCountLabel').textContent=`${data.quizzes.length} test${data.quizzes.length===1?'':'s'}`;if(!data.quizzes.length){list.innerHTML='<p class="qc-empty">No quiz codes created yet.</p>';return;}
        list.innerHTML=data.quizzes.map(q=>`<article class="qc-list-item"><div class="qc-list-main"><div><span class="qc-code-tag">${escapeHtml(q.code)}</span><strong style="margin-left:.6rem;">${escapeHtml(q.title)}</strong></div><span class="qc-list-meta">${escapeHtml(q.class_restriction||'Any class')} • ${q.attempts_allowed} attempt(s) • ${q.attempt_count||0} attempt${(q.attempt_count||0)===1?'':'s'}</span></div><div class="qc-actions"><button class="qc-copy-btn" data-copy="${escapeAttr(q.code)}">Copy code</button><button class="qc-edit-btn" data-edit="${q.id}">Edit</button><button class="qc-delete-btn" data-delete="${q.id}" data-title="${escapeAttr(q.title)}">Delete</button></div></article>`).join('');
        list.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copied';setTimeout(()=>b.textContent='Copy code',1000)}catch{}}));
        list.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openEditor(b.dataset.edit)));
        list.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>deleteQuiz(b.dataset.delete,b.dataset.title)));
      }catch(err){list.innerHTML=`<p class="qc-empty" style="color:#b42318">${escapeHtml(err.message)}</p>`;}
    }
    async function openEditor(id){
      const msg=el('editMsg');msg.textContent='Loading test…';el('editEditor').style.display='block';el('editEditor').setAttribute('aria-hidden','false');el('editId').value=id;
      try{const res=await fetch('/api/manage-quiz-code?id='+encodeURIComponent(id),{headers:authHeaders()});const data=await res.json();if(!res.ok)throw new Error(data.error||'Could not load test.');el('editCode').textContent=data.quiz.code;el('editTitle').value=data.quiz.title||'';el('editClass').value=data.quiz.class_restriction||'';el('editTime').value=data.quiz.time_limit_minutes??'';el('editAttempts').value=data.quiz.attempts_allowed??1;el('editShowAnswers').value=String(data.quiz.show_answers_after!==false);el('editExpires').value=toLocalInputValue(data.quiz.expires_at);el('editQuestionsContainer').innerHTML='';editQuestionCount=0;(data.questions||[]).forEach(q=>addQuestionBlock(el('editQuestionsContainer'),'edit',q));msg.textContent='';window.scrollTo({top:el('editEditor').offsetTop-20,behavior:'smooth'});
      }catch(err){msg.style.color='#dc2626';msg.textContent=err.message;}
    }
    function closeEditor(){el('editEditor').style.display='none';el('editEditor').setAttribute('aria-hidden','true');el('editQuestionsContainer').innerHTML='';}
    el('closeEditBtn').addEventListener('click',closeEditor);el('cancelEditBtn').addEventListener('click',closeEditor);
    el('addEditQuestionBtn').addEventListener('click',()=>addQuestionBlock(el('editQuestionsContainer'),'edit'));
    el('editForm').addEventListener('submit',async e=>{e.preventDefault();const msg=el('editMsg'),btn=el('saveEditBtn');const payload={id:el('editId').value,...formPayload(el('editQuestionsContainer'),'edit','edit')};if(!payload.questions.length){msg.style.color='#dc2626';msg.textContent='Add at least one question.';return;}if(payload.questions.some(q=>!q.question||!q.option_a||!q.option_b||!q.correct_option)){msg.style.color='#dc2626';msg.textContent='Every question needs text, options A and B, and a correct answer.';return;}btn.disabled=true;btn.textContent='Saving…';msg.textContent='';try{const res=await fetch('/api/manage-quiz-code',{method:'PUT',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify(payload)});const data=await res.json();if(!res.ok)throw new Error(data.error||'Could not save changes.');msg.style.color='#0f766e';msg.textContent='Test updated successfully.';await loadQuizzes();setTimeout(closeEditor,700);}catch(err){msg.style.color='#dc2626';msg.textContent=err.message;}finally{btn.disabled=false;btn.textContent='Save test changes';}});

    async function deleteQuiz(id,title){
      if(!confirm(`Delete “${title}” and all of its generated questions and recorded attempts? This cannot be undone.`)) return;
      try{const res=await fetch('/api/manage-quiz-code?id='+encodeURIComponent(id),{method:'DELETE',headers:authHeaders()});const data=await res.json();if(!res.ok)throw new Error(data.error||'Could not delete test.');loadQuizzes();}catch(err){alert(err.message);}
    }
    function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
    loadQuizzes();
  </script>
</body>
</html>

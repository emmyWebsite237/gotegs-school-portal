<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Latest school announcements, academic calendar updates, and event news from Go-Tegs International School Lagos."/>
  <link rel="icon" type="image/png" href="/assets/img/logo.png"/>
  <title>News &amp; Events | Go-Tegs International School</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css"/>

  <style>
    .page-hero {
      background: radial-gradient(circle at 15% 25%, rgba(37, 99, 235, 0.15) 0%, transparent 45%),
                  radial-gradient(circle at 85% 75%, rgba(245, 158, 11, 0.1) 0%, transparent 50%),
                  linear-gradient(145deg, #060911 0%, #090d16 50%, #0f172a 100%);
      color: #ffffff;
      padding: 4.5rem 1.5rem 5.5rem;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .page-hero-inner {
      max-width: 800px;
      margin: 0 auto;
    }

    .page-hero .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(96, 165, 250, 0.3);
      color: #93c5fd;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }

    .page-hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 4.5vw, 3.4rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1.25rem;
    }

    .page-hero h1 span {
      background: linear-gradient(135deg, #60a5fa, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-hero p {
      font-size: 1.1rem;
      line-height: 1.65;
      color: #cbd5e1;
    }

    .updates-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 6rem;
    }

    .update-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
    }

    .update-card {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      transition: all 0.22s ease;
    }

    .update-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: #93c5fd;
    }

    .update-card img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: #f1f5f9;
    }

    .update-card-body {
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .update-card-date {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--primary);
      margin-bottom: 0.65rem;
    }

    .update-card-message {
      font-size: 0.95rem;
      line-height: 1.65;
      color: var(--text-main);
      flex: 1;
      white-space: pre-wrap;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      background: var(--bg-alt);
      border: 1px dashed var(--border-light);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <header class="page-hero">
    <div class="page-hero-inner">
      <span class="badge-pill">School Journal</span>
      <h1>News &amp; <span>Announcements</span></h1>
      <p>Stay up to date with terminal resumption dates, academic milestones, inter-house competitions, and general school events.</p>
    </div>
  </header>

  <main class="updates-container">
    <section id="updates-feed" class="update-grid">
      <div class="empty-state">Loading latest school updates…</div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <script src="/assets/js/updates.js"></script>
</body>
</html>

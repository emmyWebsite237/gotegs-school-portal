<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Official photo gallery of Go-Tegs International School — school events, academics, sports, and celebrations."/>
  <link rel="icon" type="image/png" href="/assets/img/logo.png"/>
  <title>School Gallery | Go-Tegs International School</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css"/>

  <style>
    .gallery-page-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 5rem;
    }

    .gallery-intro {
      text-align: center;
      max-width: 700px;
      margin: 0 auto 3rem;
    }

    .gallery-intro .badge-pill {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .gallery-intro h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.75rem;
    }

    .gallery-intro p {
      font-size: 1.05rem;
      color: var(--text-muted);
    }

    .gallery-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.25rem;
      background: var(--bg-alt);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      margin-bottom: 2rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .gallery-meta-bar strong {
      color: var(--text-main);
    }

    /* Modern Photo Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .gallery-item-card {
      border-radius: 18px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      transition: all 0.22s ease;
      cursor: zoom-in;
      display: flex;
      flex-direction: column;
    }

    .gallery-item-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: #93c5fd;
    }

    .gallery-item-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      background: #f1f5f9;
      display: block;
      transition: transform 0.3s ease;
    }

    .gallery-item-card:hover img {
      transform: scale(1.04);
    }

    .gallery-item-card figcaption {
      padding: 0.85rem 1.15rem;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-top: 1px solid #f1f5f9;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      background: var(--bg-alt);
      border: 1px dashed var(--border-light);
      border-radius: 18px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Lightbox Modal */
    .lightbox-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(9, 13, 22, 0.95);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .lightbox-modal.open {
      display: flex;
    }

    .lightbox-modal img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      object-fit: contain;
    }

    .lightbox-close-btn {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-size: 1.5rem;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .lightbox-close-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    @media (max-width: 600px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
      .gallery-page-container {
        padding: 2rem 1rem 3.5rem;
      }
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="gallery-page-container">
    <section class="gallery-intro">
      <span class="badge-pill">Visual Archive</span>
      <h1>School Life in Pictures</h1>
      <p>Explore vibrant moments of learning, academic competitions, arts, sports, and school community life.</p>
    </section>

    <div class="gallery-meta-bar">
      <div>School Album: <strong>Go-Tegs Official Moments</strong></div>
      <div id="galleryCount">Loading photos…</div>
    </div>

    <div class="gallery-grid" id="galleryGrid">
      <div class="empty-state">Loading moments from school cloud storage…</div>
    </div>
  </main>

  <!-- Modern Lightbox -->
  <div class="lightbox-modal" id="galleryLightbox" aria-hidden="true" role="dialog" aria-label="Photo viewer">
    <button type="button" class="lightbox-close-btn" id="galleryClose" aria-label="Close photo">&times;</button>
    <img id="galleryLightboxImage" alt="Go-Tegs school photo large view" />
  </div>

  <div id="footer-placeholder"></div>

  <script src="/assets/js/main.js"></script>
  <script>
    const GALLERY_ENDPOINT = '/api/admin-verify?gallery=cloudinary';
    const FALLBACK_ENDPOINT = '/api/admin-verify?gallery=public';

    async function renderGallery() {
      const grid = document.getElementById('galleryGrid');
      const count = document.getElementById('galleryCount');

      try {
        let images = [];
        let cursor = '';
        do {
          const url = new URL(GALLERY_ENDPOINT, window.location.origin);
          if (cursor) url.searchParams.set('cursor', cursor);
          const res = await fetch(url.toString(), { headers: { Accept: 'application/json' } });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Cloudinary gallery could not be loaded.');
          images.push(...(data.images || []));
          cursor = data.next_cursor || '';
        } while (cursor);

        if (!images.length) {
          count.textContent = '0 photos found';
          grid.innerHTML = '<div class="empty-state">No photos uploaded to Cloudinary yet.</div>';
          return;
        }

        count.innerHTML = `Showing <strong>${images.length}</strong> photo${images.length === 1 ? '' : 's'}`;
        grid.innerHTML = images.map((image, i) => {
          const title = String(image.title || image.public_id || `School Life • ${i+1}`);
          const url = String(image.cloudinary_url || image.secure_url || '');
          const alt = String(image.alt_text || title || 'Go-Tegs gallery image');
          return `
            <figure class="gallery-item-card">
              <img src="${url.replace(/"/g, '&quot;')}" alt="${alt.replace(/"/g, '&quot;')}" loading="lazy" />
              <figcaption>${title.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</figcaption>
            </figure>
          `;
        }).join('');

        grid.querySelectorAll('.gallery-item-card').forEach(card => {
          card.addEventListener('click', () => {
            const img = card.querySelector('img');
            if (img) openLightbox(img.src);
          });
        });
      } catch (err) {
        try {
          const fallback = await fetch(FALLBACK_ENDPOINT, { headers: { Accept: 'application/json' } });
          const data = await fallback.json().catch(() => ({}));
          const fallbackImages = data.images || [];
          if (!fallbackImages.length) throw err;

          count.innerHTML = `Showing <strong>${fallbackImages.length}</strong> photos`;
          grid.innerHTML = fallbackImages.map((image, i) => `
            <figure class="gallery-item-card">
              <img src="${String(image.cloudinary_url||'').replace(/"/g, '&quot;')}" alt="${String(image.alt_text||'School photo').replace(/"/g, '&quot;')}" loading="lazy" />
              <figcaption>${String(image.title || `Photo ${i+1}`).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</figcaption>
            </figure>
          `).join('');

          grid.querySelectorAll('.gallery-item-card').forEach(card => {
            card.addEventListener('click', () => {
              const img = card.querySelector('img');
              if (img) openLightbox(img.src);
            });
          });
        } catch (fbErr) {
          count.textContent = 'Gallery unavailable';
          grid.innerHTML = '<div class="empty-state">Photos could not be loaded at this time. Please check your internet connection or server settings.</div>';
        }
      }
    }

    const lightbox = document.getElementById('galleryLightbox');
    const lightboxImage = document.getElementById('galleryLightboxImage');

    function openLightbox(src) {
      lightboxImage.src = src;
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      lightboxImage.removeAttribute('src');
      document.body.style.overflow = '';
    }

    document.getElementById('galleryClose').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    renderGallery();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Gallery of moments from Go-Tegs International School."/>
  <link rel="icon" type="image/png" href="/assets/img/logo.png"/>
  <title>Gallery | Go-Tegs International School</title>
  <link rel="stylesheet" href="/assets/css/public-site.css"/>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <main class="public-site">
    <div class="content-page">
      <section class="page-intro">
        <span class="section-kicker">Go-Tegs · School life</span>
        <h1>Moments worth remembering.</h1>
        <div class="page-intro-copy"><p>Browse recent photographs from around the school. New images can be added to the gallery source without changing this page.</p></div>
      </section>
      <div class="gallery-label"><span class="section-kicker">Gallery</span><small id="galleryCount">Preparing the gallery…</small></div>
      <div class="gallery-grid-public" id="galleryGrid"><div class="empty-state gallery-empty-public">Loading school moments…</div></div>
    </div>
  </main>
  <div class="lightbox-public" id="galleryLightbox" aria-hidden="true"><button type="button" id="galleryClose" aria-label="Close image">×</button><img id="galleryLightboxImage" alt="Go-Tegs gallery photo"/></div>
  <div id="footer-placeholder"></div>
  <script src="/assets/js/main.js"></script>
  <script>
    const GH_OWNER="YOUR-GITHUB-USERNAME",GH_REPO="gotegs-school-website",GH_FOLDER="assets/img/gallery",CACHE_KEY="gotegs_gallery_cache_v2",CACHE_MAX_AGE_MS=60*60*1000,IMAGE_EXT=/\.(png|jpe?g|gif|webp|avif)$/i;
    async function ghFetch(url){const res=await fetch(url,{headers:{Accept:"application/vnd.github+json"}});if(!res.ok)throw new Error(`GitHub API error (${res.status})`);return res.json();}
    async function loadGalleryOrdered(){
      const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");
      if(cached&&Date.now()-cached.savedAt<CACHE_MAX_AGE_MS)return cached.urls;
      if(GH_OWNER==="YOUR-GITHUB-USERNAME")throw new Error("Gallery source is not configured yet.");
      const files=await ghFetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FOLDER}`);
      const images=files.filter(f=>f.type==="file"&&IMAGE_EXT.test(f.name));
      if(!images.length)return[];
      const urls=images.map(f=>f.download_url);
      localStorage.setItem(CACHE_KEY,JSON.stringify({urls,savedAt:Date.now()}));
      return urls;
    }
    async function renderGallery(){
      const grid=document.getElementById('galleryGrid'),count=document.getElementById('galleryCount');
      try{
        const urls=await loadGalleryOrdered();
        if(!urls.length){count.textContent='No photos uploaded yet';grid.innerHTML='<div class="empty-state gallery-empty-public">The gallery is ready for school photos.</div>';return;}
        count.textContent=`${urls.length} photo${urls.length===1?'':'s'}`;
        grid.innerHTML=urls.map((u,i)=>`<figure class="gallery-card"><img src="${u.replace(/"/g,'&quot;')}" alt="Go-Tegs school gallery photo ${i+1}" loading="lazy" draggable="false"/><figcaption>Go-Tegs school life · ${i+1}</figcaption></figure>`).join('');
        grid.querySelectorAll('img').forEach(img=>{img.addEventListener('contextmenu',e=>e.preventDefault());img.addEventListener('dragstart',e=>e.preventDefault());img.addEventListener('click',()=>openLightbox(img.src));});
      }catch(err){count.textContent='Gallery source pending';grid.innerHTML='<div class="empty-state gallery-empty-public"><strong>The gallery is ready for school photos.</strong><br/>Connect the configured gallery source to populate it.</div>';}
    }
    const lightbox=document.getElementById('galleryLightbox'),lightboxImage=document.getElementById('galleryLightboxImage');
    function openLightbox(src){lightboxImage.src=src;lightbox.classList.add('open');lightbox.setAttribute('aria-hidden','false');}
    function closeLightbox(){lightbox.classList.remove('open');lightbox.setAttribute('aria-hidden','true');lightboxImage.removeAttribute('src');}
    document.getElementById('galleryClose').addEventListener('click',closeLightbox);
    lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLightbox();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});
    renderGallery();
  </script>
</body>
</html>

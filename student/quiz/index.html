<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Quiz & Practice | Go-Tegs</title><link rel="stylesheet" href="/assets/css/style.css"/><link rel="stylesheet" href="/assets/css/portal.css"/><style>
.quiz-app{max-width:1180px;margin:0 auto;padding:1.3rem 1rem 3rem}.quiz-head{display:flex;justify-content:space-between;gap:1rem;align-items:end;flex-wrap:wrap}.quiz-head h1{margin:.2rem 0 .35rem;font-size:clamp(2rem,4vw,3.4rem);letter-spacing:-.05em}.quiz-head p{margin:0;color:#667085;max-width:720px}.library-tools{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin:1rem 0}.search-wrap{position:relative;flex:1;min-width:260px}.search-wrap input{width:100%;box-sizing:border-box;padding:.82rem 2.6rem .82rem 1rem;border:1px solid #dddff0;border-radius:13px;background:#fff;font-size:.9rem}.search-clear{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);border:0;background:transparent;width:34px;height:34px;border-radius:10px;color:#757b8a;font-size:1.15rem}.search-clear:disabled{opacity:0;pointer-events:none}.random-btn{border:0;border-radius:13px;padding:.82rem 1rem;background:linear-gradient(135deg,#6b5cff,#ff7a59);color:#fff;font:800 .72rem var(--font-display);cursor:pointer}.quiz-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}.lib-card{position:relative;min-height:190px;padding:1.1rem;border:1px solid #e0e2ef;border-radius:21px;background:linear-gradient(150deg,#fff,#f7f6ff);box-shadow:0 14px 35px rgba(31,30,56,.07);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;cursor:pointer}.lib-card::before{content:'';position:absolute;inset:-35% auto auto -10%;width:170px;height:170px;border-radius:50%;background:rgba(107,92,255,.1)}.lib-card .badge{position:absolute;top:1rem;right:1rem;padding:.34rem .52rem;border-radius:999px;background:#f0efff;color:#5147b9;font:800 .55rem var(--font-display);text-transform:uppercase;letter-spacing:.08em}.lib-card h3{margin:0 0 .35rem;font:900 1rem var(--font-display);color:#171822;position:relative}.lib-meta{display:flex;gap:.45rem;flex-wrap:wrap;color:#687083;font-size:.68rem}.lib-meta span{padding:.33rem .48rem;border-radius:999px;background:#f3f4f8}.lib-action{margin-top:.8rem;color:#5a4bd1;font:900 .68rem var(--font-display)}.empty{padding:2.2rem;border:1px dashed #d8dbeb;border-radius:18px;background:#fff;text-align:center;color:#72798a}.preview-backdrop{position:fixed;inset:0;background:rgba(17,18,28,.65);backdrop-filter:blur(8px);display:none;place-items:center;z-index:200}.preview-backdrop.open{display:grid}.preview-modal{width:min(650px,calc(100vw - 2rem));padding:1.25rem;border-radius:24px;background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.28)}.preview-top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}.preview-top h2{margin:0;font:900 1.2rem var(--font-display)}.preview-close{width:38px;height:38px;border:1px solid #e1e2ec;border-radius:12px;background:#fafaff}.preview-copy{color:#687083;font-size:.78rem;line-height:1.55}.preview-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem;margin:1rem 0}.preview-stat{padding:.7rem;border-radius:14px;background:#f7f7fb}.preview-stat small{display:block;font-size:.55rem;text-transform:uppercase;letter-spacing:.08em;color:#81879a}.preview-stat strong{display:block;margin-top:.15rem;color:#272936;font:900 .82rem var(--font-display)}.preview-actions{display:flex;gap:.55rem;justify-content:flex-end;flex-wrap:wrap}.preview-actions .btn{border:0;background:linear-gradient(135deg,#6b5cff,#4337b8);color:#fff}.countdown-overlay{position:fixed;inset:0;display:none;place-items:center;background:radial-gradient(circle at center,rgba(107,92,255,.22),rgba(14,15,22,.98));z-index:250;color:#fff;text-align:center}.countdown-inner{display:grid;place-items:center}.countdown-small{font:800 .65rem var(--font-display);letter-spacing:.16em;text-transform:uppercase;opacity:.72}.countdown-ring{width:150px;height:150px;border:2px solid rgba(255,255,255,.22);border-radius:50%;display:grid;place-items:center;margin-top:.8rem;box-shadow:0 0 0 20px rgba(107,92,255,.05)}.countdown-number{font:900 4rem var(--font-display)}.quiz-work{display:none;margin-top:1.1rem}.quiz-work.open{display:block}.quiz-panel{padding:1.2rem;border-radius:22px;background:#fff;border:1px solid #e0e2ef;box-shadow:0 16px 38px rgba(31,30,56,.08)}.quiz-row{display:flex;justify-content:space-between;gap:1rem;align-items:center}.timer{font:900 .75rem var(--font-display);color:#5147b9}.timer.low{color:#c2412d}.progress{height:8px;border-radius:999px;background:#f0f0f7;overflow:hidden;margin:.75rem 0 1.1rem}.progress span{display:block;height:100%;background:linear-gradient(90deg,#6b5cff,#ff7a59);width:0}.question{font:900 1.2rem/1.45 var(--font-display);color:#171822}.options{display:grid;gap:.6rem;margin-top:1rem}.option{display:flex;gap:.7rem;align-items:flex-start;padding:.85rem;border:1px solid #dedff0;border-radius:13px;background:#fff;text-align:left}.option:hover{border-color:#aaa4f3;background:#fbfaff}.option .key{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:#efeeff;color:#5147b9;font:900 .65rem var(--font-display)}.delay{text-align:center;padding:3rem 1rem;display:none}.spinner{width:58px;height:58px;margin:0 auto 1rem;border:4px solid #e9e9f6;border-top-color:#6b5cff;border-radius:50%;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.quiz-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.quiz-grid{grid-template-columns:1fr}.preview-stats{grid-template-columns:1fr 1fr}.quiz-app{padding-left:.8rem;padding-right:.8rem}}
</style></head>
<body class="student-shell-page"><div id="navbar-placeholder"></div><main class="quiz-app"><div class="quiz-head"><div><div class="portal-section-label">Practice library</div><h1>Find a quiz. Make it yours.</h1><p>Search for a school practice quiz or let the system pick one for you. Prescribed tests remain available through Quiz Code.</p></div></div><div class="library-tools"><div class="search-wrap"><input id="search" type="search" placeholder="Search quizzes by title…" autocomplete="off"/><button id="clearSearch" class="search-clear" type="button" aria-label="Clear search">×</button></div><button id="randomBtn" class="random-btn" type="button">Surprise me</button></div><p id="status" role="status" aria-live="polite"></p><section class="quiz-grid" id="quizGrid"></section><section class="quiz-work" id="quizWork"><div class="quiz-panel"><div class="quiz-row"><strong id="workTitle"></strong><span class="timer" id="timer"></span></div><div class="progress"><span id="bar"></span></div><div id="questionArea"><div class="question" id="question"></div><div class="options" id="options"></div><div style="display:flex;justify-content:flex-end;margin-top:1rem"><button class="btn" id="nextBtn">Next →</button></div></div><div class="delay" id="delay"><div class="spinner"></div><h2>Checking your work…</h2><p>Your result will appear shortly.</p></div><div id="result" style="display:none;text-align:center"><h2 style="font:900 1.6rem var(--font-display)">Test complete</h2><div style="font:900 2.8rem var(--font-display);color:#5147b9" id="score"></div><p id="resultMsg"></p><button class="btn" id="backToLibrary">Back to Quiz Library</button></div></div></section></main><div id="previewBackdrop" class="preview-backdrop"><section class="preview-modal" role="dialog" aria-modal="true" aria-labelledby="previewTitle"><div class="preview-top"><h2 id="previewTitle"></h2><button class="preview-close" id="previewClose" type="button" aria-label="Close preview">×</button></div><p class="preview-copy" id="previewCopy"></p><div class="preview-stats"><div class="preview-stat"><small>Questions</small><strong id="previewQuestions">—</strong></div><div class="preview-stat"><small>Time</small><strong id="previewTime">—</strong></div><div class="preview-stat"><small>Attempts</small><strong id="previewAttempts">—</strong></div><div class="preview-stat"><small>Class</small><strong id="previewClass">—</strong></div></div><div class="preview-actions"><button class="btn" id="previewStart" type="button">Start Test</button></div></section></div><div class="countdown-overlay" id="countdown"><div class="countdown-inner"><div class="countdown-small">Get ready</div><div class="countdown-ring"><div class="countdown-number" id="countdownNumber">3</div></div></div></div><script src="/assets/js/main.js"></script><script>
(()=>{const KEY='gotegs_student_session',session=JSON.parse(localStorage.getItem(KEY)||'null');if(!session?.student_id){location.href='/student/index.html';return;}const $=id=>document.getElementById(id),escapeHtml=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));let quizzes=[],selected=null,state=null,timer=null,submitting=false;const setStatus=(t,c)=>{const s=$('status');s.textContent=t;s.style.color=c||'#667085'};
function formatDuration(totalSeconds){const sec=Math.max(0,Math.round(Number(totalSeconds)||0));const m=Math.floor(sec/60),s=sec%60;return m?`${m}m ${String(s).padStart(2,'0')}s`:`${s}s`}
async function api(url){const r=await fetch(url);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Could not load quizzes.');return d}
async function load(){setStatus('Loading practice library…');try{const d=await api(`/api/quiz-code-fetch?library=1&student_id=${encodeURIComponent(session.student_id)}&class=${encodeURIComponent(session.class||'')}`);quizzes=d.quizzes||[];render();setStatus(`${quizzes.length} quiz${quizzes.length===1?'':'zes'} available.`,'#5147b9')}catch(e){setStatus(e.message,'#c53030')}}
function render(){const q=($('search').value||'').trim().toLowerCase();const list=quizzes.filter(x=>!q||String(x.title||'').toLowerCase().includes(q));$('quizGrid').innerHTML=list.length?list.map(x=>`<article class="lib-card" data-id="${x.id}"><span class="badge">${x.class_restriction||'Open'}</span><h3>${escapeHtml(x.title)}</h3><div class="lib-meta"><span>${x.question_count} questions</span><span>${x.time_limit_seconds!=null?formatDuration(x.time_limit_seconds):'No limit'}</span><span>${x.attempts_remaining==null?'Unlimited attempts':x.attempts_remaining+' left'}</span></div><div class="lib-action">Preview →</div></article>`).join(''):'<div class="empty" style="grid-column:1/-1">No quizzes match that search.</div>';$('clearSearch').disabled=!q;$('quizGrid').querySelectorAll('[data-id]').forEach(c=>c.addEventListener('click',()=>preview(c.dataset.id)));}
async function preview(id){try{const d=await api(`/api/quiz-code-fetch?quiz_id=${encodeURIComponent(id)}&student_id=${encodeURIComponent(session.student_id)}&class=${encodeURIComponent(session.class||'')}`);selected=d;$('previewTitle').textContent=d.title;$('previewCopy').textContent='Review the details before you begin. Starting is a deliberate choice, followed by a three-second countdown.';$('previewQuestions').textContent=d.questions.length;$('previewTime').textContent=d.time_limit_seconds!=null?formatDuration(d.time_limit_seconds):'No limit';$('previewAttempts').textContent=d.attempts_remaining==null?'Unlimited':d.attempts_remaining;$('previewClass').textContent=d.class_restriction||'Open';$('previewBackdrop').classList.add('open');}catch(e){setStatus(e.message,'#c53030')}}
$('previewClose').addEventListener('click',()=>$('previewBackdrop').classList.remove('open'));$('previewStart').addEventListener('click',()=>{ $('previewBackdrop').classList.remove('open');startCountdown();});function startCountdown(){const ov=$('countdown'),num=$('countdownNumber');ov.style.display='grid';let n=3;num.textContent=n;const t=setInterval(()=>{n--;if(n<=0){clearInterval(t);ov.style.display='none';openQuiz();}else num.textContent=n;},900)}
function openQuiz(){state={...selected,index:0,answers:{}};$('quizGrid').style.display='none';document.querySelector('.library-tools').style.display='none';$('quizWork').classList.add('open');showQuestion();if(state.time_limit_seconds != null) startTimer(Number(state.time_limit_seconds))}
function startTimer(sec){let left=sec;const tick=()=>{const m=Math.floor(left/60),s=left%60;$('timer').textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;$('timer').classList.toggle('low',left<=30);if(left<=0){clearInterval(timer);submit()}left--};tick();timer=setInterval(tick,1000)}
function showQuestion(){const q=state.questions[state.index];$('workTitle').textContent=state.title;$('question').textContent=`${state.index+1}. ${q.question}`;$('bar').style.width=(state.index/state.questions.length*100)+'%';const opts=[['a',q.option_a],['b',q.option_b],['c',q.option_c],['d',q.option_d]].filter(([,v])=>v);$('options').innerHTML=opts.map(([k,v])=>`<button class="option" type="button" data-key="${k}"><span class="key">${k.toUpperCase()}</span><span>${escapeHtml(v)}</span></button>`).join('');$('options').querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>{state.answers[q.id]=b.dataset.key;showQuestion();}));$('nextBtn').textContent=state.index===state.questions.length-1?'Submit Test':'Next →';}
$('nextBtn').addEventListener('click',()=>{if(state.index<state.questions.length-1){state.index++;showQuestion()}else submit()});async function submit(){if(submitting)return;submitting=true;clearInterval(timer);$('questionArea').style.display='none';$('delay').style.display='block';const answers=state.questions.map(q=>({question_id:q.id,selected:state.answers[q.id]||null}));try{const r=await fetch('/api/quiz-code-submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({quiz_id:state.quiz_id,student_id:session.student_id,answers})});const d=await r.json().catch(()=>({}));await new Promise(r=>setTimeout(r,5000));$('delay').style.display='none';$('result').style.display='block';$('score').textContent=r.ok?`${d.score} / ${d.total}`:'—';$('resultMsg').textContent=r.ok?(d.total?Math.round(d.score/d.total*100)+'% correct': 'Test submitted.'):(d.error||'Could not submit test.');}catch(e){await new Promise(r=>setTimeout(r,5000));$('delay').style.display='none';$('result').style.display='block';$('score').textContent='—';$('resultMsg').textContent='Connection error: '+e.message}}
$('backToLibrary').addEventListener('click',()=>location.reload());$('search').addEventListener('input',render);$('clearSearch').addEventListener('click',()=>{$('search').value='';render();$('search').focus()});$('search').addEventListener('keydown',e=>{if(e.key==='Escape'){$('search').value='';render()}});$('randomBtn').addEventListener('click',()=>{if(quizzes.length)preview(quizzes[Math.floor(Math.random()*quizzes.length)].id)});load();})();
</script></body></html>

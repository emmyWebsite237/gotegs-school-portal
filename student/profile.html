<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile | Go-Tegs Student Portal</title>
  <link rel="icon" type="image/png" href="/assets/img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/portal.css" />
  <style>
    .profile-layout {
      margin-left: var(--portal-rail-width);
      padding: 2.25rem 3rem 4rem;
      min-height: 100vh;
      box-sizing: border-box;
      max-width: 1100px;
    }
    .profile-header-card {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 2rem 2.5rem;
      border-radius: 20px;
      background: #ffffff;
      border: 1px solid var(--portal-border);
      box-shadow: var(--portal-shadow-sm);
      margin-bottom: 1.75rem;
    }
    .profile-avatar-xl {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid #3b82f6;
      background: #0f172a;
      overflow: hidden;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }
    .profile-avatar-xl img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .profile-avatar-xl .profile-initials-xl {
      display: none;
      font-family: var(--font-heading);
      font-size: 1.75rem;
      font-weight: 800;
      color: #93c5fd;
    }
    .profile-avatar-xl.show-initials img { display: none; }
    .profile-avatar-xl.show-initials .profile-initials-xl { display: grid; }
    .profile-header-info h1 {
      font-family: var(--font-heading);
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--portal-text-main);
      margin-bottom: 0.25rem;
    }
    .profile-header-info p {
      font-size: 0.95rem;
      color: var(--portal-text-muted);
    }
    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 1.75rem;
    }
    .info-card {
      background: #ffffff;
      border: 1px solid var(--portal-border);
      border-radius: 18px;
      padding: 1.5rem 1.75rem;
      box-shadow: var(--portal-shadow-sm);
    }
    .info-card h2 {
      font-family: var(--font-heading);
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--portal-primary);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--portal-border);
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.9rem;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: var(--portal-text-muted); font-weight: 500; }
    .info-val { color: var(--portal-text-main); font-weight: 700; }
    .photo-card {
      background: #ffffff;
      border: 1px solid var(--portal-border);
      border-radius: 18px;
      padding: 1.5rem 1.75rem;
      box-shadow: var(--portal-shadow-sm);
    }
    .photo-card h2 {
      font-family: var(--font-heading);
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--portal-primary);
      margin-bottom: 0.75rem;
    }
    .photo-card p {
      font-size: 0.88rem;
      color: var(--portal-text-muted);
      margin-bottom: 1.25rem;
    }
    .photo-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }
    .photo-actions input[type="file"] {
      font-size: 0.85rem;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--portal-border);
      border-radius: 10px;
      background: #f8fafc;
    }
    .btn-action {
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .btn-action--primary {
      background: var(--portal-primary);
      color: #ffffff;
    }
    .btn-action--primary:hover { background: var(--portal-primary-hover); }
    .btn-action--secondary {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid var(--portal-border);
    }
    .btn-action--secondary:hover { background: #e2e8f0; }
    .status-msg {
      min-height: 1.25rem;
      margin-top: 0.75rem;
      font-size: 0.85rem;
      font-weight: 700;
    }
    @media (max-width: 960px) {
      .profile-layout { margin-left: 0; padding: 1.5rem 1rem 3rem; }
      .profile-grid { grid-template-columns: 1fr; }
      .profile-header-card { flex-direction: column; text-align: center; padding: 1.5rem; }
    }
  </style>
</head>
<body class="student-shell-page">
  <div id="navbar-placeholder"></div>

  <main class="profile-layout">
    <div class="profile-header-card">
      <div class="profile-avatar-xl" id="avatarWrap">
        <img id="profileImage" src="/assets/img/logo.png" alt="Student photo"/>
        <span class="profile-initials-xl" id="profileInitials" aria-hidden="true">GT</span>
      </div>
      <div class="profile-header-info">
        <h1 id="profileName">Student Name</h1>
        <p id="profileSubtitle">Verified Go-Tegs Portal Identity</p>
      </div>
    </div>

    <div class="profile-grid">
      <section class="info-card">
        <h2>Student Information</h2>
        <div class="info-row">
          <span class="info-label">Full Name</span>
          <span class="info-val" id="profileFullName">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Student ID</span>
          <span class="info-val" id="profileId">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Class</span>
          <span class="info-val" id="profileClass">—</span>
        </div>
      </section>

      <section class="info-card">
        <h2>Academic Placement</h2>
        <div class="info-row">
          <span class="info-label">Department</span>
          <span class="info-val" id="profileDept">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Session / Year</span>
          <span class="info-val" id="profileYear">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Arm / Division</span>
          <span class="info-val" id="profileSection">—</span>
        </div>
      </section>
    </div>

    <section class="photo-card">
      <h2>Profile Photo Management</h2>
      <p id="photoCopy">Your photo appears across the student portal dashboard and official result slips.</p>
      <div class="photo-actions">
        <input id="profilePicture" type="file" accept="image/jpeg,image/png,image/webp"/>
        <button class="btn-action btn-action--primary" id="uploadPicture" type="button">Save Picture</button>
        <button class="btn-action btn-action--secondary" id="removePicture" type="button">Remove Picture</button>
      </div>
      <div class="status-msg" id="photoMsg" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="/assets/js/main.js"></script>
  <script>
    (function(){
      const KEY = 'gotegs_student_session';
      const dismissKey = id => `gotegs_profile_setup_dismissed:${String(id||'').toUpperCase()}`;
      const raw = localStorage.getItem(KEY);
      if(!raw) { window.location.replace('/student/index.html'); return; }
      let s;
      try { s = JSON.parse(raw); } catch { return; }
      
      const $ = id => document.getElementById(id);
      const name = String(s.full_name || 'Student');
      const initials = name.split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase() || 'GT';

      $('profileName').textContent = name;
      $('profileSubtitle').textContent = (s.class || 'Student') + (s.dept ? ' · ' + s.dept : '');
      $('profileFullName').textContent = name;
      $('profileId').textContent = s.student_id || '—';
      $('profileClass').textContent = s.class || '—';
      $('profileDept').textContent = s.dept || '—';
      $('profileYear').textContent = s.year || '—';
      $('profileSection').textContent = s.section === 'jss_students' ? 'Junior Arm (JSS)' : s.section === 'sss_students' ? 'Senior Arm (SSS)' : (s.section || '—');
      $('profileInitials').textContent = initials;

      const img = $('profileImage'), wrap = $('avatarWrap'), input = $('profilePicture');
      const upload = $('uploadPicture'), remove = $('removePicture'), msg = $('photoMsg'), copy = $('photoCopy');

      const paint = () => {
        const photo = !!s.profile_pic_url;
        img.src = photo ? s.profile_pic_url : '/assets/img/logo.png';
        wrap.classList.toggle('show-initials', !!s.profile_pic_removed && !photo);
        remove.style.display = photo ? 'inline-flex' : 'none';
        copy.textContent = photo ? 'Your profile photo is saved and active.' : 'No photo uploaded. You can choose a JPEG or PNG image to personalize your account.';
      };
      paint();

      const setMsg = (t, isErr) => {
        msg.textContent = t;
        msg.style.color = isErr ? '#ef4444' : '#10b981';
      };

      upload.addEventListener('click', async () => {
        const f = input.files?.[0];
        if(!f) { setMsg('Please select an image file first.', true); return; }
        if(f.size > 2 * 1024 * 1024) { setMsg('The file must be less than 2 MB.', true); return; }
        
        upload.disabled = true; remove.disabled = true; upload.textContent = 'Uploading…';
        try {
          const data = await new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onload = () => resolve(String(r.result).split(',').pop());
            r.onerror = () => reject(new Error('Could not read image file.'));
            r.readAsDataURL(f);
          });
          const res = await fetch('/api/student-profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ student_id: s.student_id, pin: s.pin, section: s.section, file_name: f.name, mime_type: f.type, data })
          });
          const d = await res.json().catch(()=>({}));
          if(!res.ok) throw new Error(d.error || 'Failed to update photo.');
          s.profile_pic_url = d.profile_pic_url || null;
          s.profile_pic_removed = false;
          s.lastActivity = Date.now();
          localStorage.setItem(KEY, JSON.stringify(s));
          setMsg('Profile photo updated successfully!', false);
          input.value = '';
          paint();
        } catch(err) {
          setMsg(err.message || 'Upload failed.', true);
        } finally {
          upload.disabled = false; remove.disabled = false; upload.textContent = 'Save Picture';
        }
      });

      remove.addEventListener('click', async () => {
        if(!s.profile_pic_url) {
          s.profile_pic_removed = true;
          localStorage.setItem(KEY, JSON.stringify(s));
          paint();
          return;
        }
        remove.disabled = true; upload.disabled = true;
        setMsg('Removing photo…', false);
        try {
          const res = await fetch('/api/student-profile?student_id=' + encodeURIComponent(s.student_id) + '&pin=' + encodeURIComponent(s.pin), {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ student_id: s.student_id, pin: s.pin, section: s.section })
          });
          const d = await res.json().catch(()=>({}));
          if(!res.ok) throw new Error(d.error || 'Could not remove photo.');
          s.profile_pic_url = null;
          s.profile_pic_removed = true;
          s.lastActivity = Date.now();
          localStorage.setItem(KEY, JSON.stringify(s));
          setMsg('Photo removed.', false);
          paint();
        } catch(err) {
          setMsg(err.message || 'Could not remove photo.', true);
        } finally {
          remove.disabled = false; upload.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>

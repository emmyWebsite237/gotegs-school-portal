<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal | Go-Tegs International School</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .login-hero{position:relative;overflow:hidden;margin-top:1.5rem;border-radius:20px;text-align:center;padding:2.2rem 1.5rem 1.8rem;color:#fff;background:linear-gradient(135deg,var(--teal) 0%,var(--teal-dark) 60%,var(--maroon-deep) 130%)}
    .login-hero .floaty{position:absolute;font-size:2rem;opacity:.18;animation:floaty 6s ease-in-out infinite}.login-hero .f1{top:12%;left:8%}.login-hero .f2{top:60%;left:16%;font-size:1.5rem;animation-delay:1.2s}.login-hero .f3{top:18%;right:10%;animation-delay:.6s}.login-hero .f4{bottom:12%;right:16%;font-size:1.6rem;animation-delay:2s}@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(8deg)}}
    .login-hero .crest{font-size:2.6rem;margin-bottom:.4rem;position:relative;z-index:1}.login-hero h1{color:#fff;margin:0 0 .3rem;position:relative;z-index:1}.login-hero p{color:rgba(255,255,255,.85);margin:0;position:relative;z-index:1;font-size:.92rem}
    .login-card,.profile-setup-card{max-width:450px;margin:-1.5rem auto 0;padding:1.75rem;position:relative;z-index:2;border:1px solid var(--border);border-radius:var(--radius);background:var(--paper);box-shadow:var(--shadow-md)}
    .login-card label,.profile-setup-card label{font-family:var(--font-display);font-weight:600;font-size:.85rem;margin-top:.5rem;display:block}.login-card input,.profile-setup-card input{width:100%;font-family:var(--font-body);font-size:.95rem;padding:.7rem .8rem;margin-top:.35rem;border:1px solid var(--border);border-radius:8px;box-sizing:border-box}
    .login-card .btn,.profile-setup-card .btn{width:100%;margin-top:1.2rem;justify-content:center}.login-card .btn:disabled,.profile-setup-card .btn:disabled{opacity:.65;cursor:wait}
    #loginMsg{margin-top:.9rem;font-size:.84rem;font-weight:600;min-height:1.2rem}.profile-setup-card{display:none;margin-top:1rem}.profile-setup-card.open{display:block}.setup-icon{width:74px;height:74px;margin:0 auto .75rem;border-radius:22px;display:grid;place-items:center;background:#eef5fb;border:1px solid #dce8f0;overflow:hidden}.setup-icon img{width:100%;height:100%;object-fit:cover}.setup-title{text-align:center;margin:0;color:#173149;font:900 1rem var(--font-display)}.setup-copy{text-align:center;margin:.4rem 0 1rem;color:#718190;font-size:.76rem;line-height:1.5}.setup-actions{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}.setup-actions .btn{margin-top:0}.skip-btn{border:1px solid var(--border);background:#f8fafb;color:#486174}.file-help{display:block;margin-top:.4rem;color:#8796a2;font-size:.68rem;text-align:center}.hide{display:none!important}
    @media(max-width:600px){.setup-actions{grid-template-columns:1fr}.setup-actions .btn{width:100%}}
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <main class="page-container" style="max-width:640px;">
    <nav class="breadcrumb">Home / Student</nav>
    <div class="login-hero"><span class="floaty f1">📘</span><span class="floaty f2">✏️</span><span class="floaty f3">🎓</span><span class="floaty f4">⭐</span><div class="crest">🎓</div><h1>Student Portal</h1><p>Log in with your Student ID and PIN to access your dashboard.</p></div>

    <form class="login-card" id="loginForm">
      <label for="studentId">Student ID</label><input type="text" id="studentId" placeholder="GT/..." autocomplete="username" required />
      <label for="pin">PIN</label><input type="password" id="pin" autocomplete="current-password" required />
      <button type="submit" class="btn" id="loginBtn">Log In</button>
      <p id="loginMsg" role="status" aria-live="polite"></p>
    </form>

    <section class="profile-setup-card" id="profileSetup" aria-labelledby="profileSetupTitle">
      <div class="setup-icon"><img id="setupPreview" src="/assets/img/logo.png" alt="Profile picture preview" /></div>
      <h2 class="setup-title" id="profileSetupTitle">Add your profile picture</h2>
      <p class="setup-copy">You can upload it now, or skip for now. Once a profile picture is saved, this setup screen will stop appearing on future logins.</p>
      <label for="profilePicture">Choose a picture</label>
      <input id="profilePicture" type="file" accept="image/jpeg,image/png,image/webp" />
      <span class="file-help">JPG, PNG or WebP · maximum 2 MB</span>
      <div class="setup-actions" style="margin-top:1rem"><button type="button" class="btn" id="uploadPicture">Upload &amp; continue</button><button type="button" class="btn skip-btn" id="skipPicture">Skip for now</button></div>
      <p id="profileMsg" role="status" aria-live="polite" style="min-height:1.1rem;margin:.75rem 0 0;text-align:center;font-size:.76rem;font-weight:700"></p>
    </section>
  </main>
  <div id="footer-placeholder"></div>
  <script src="/assets/js/main.js"></script>
  <script>
    (function(){
      const raw=localStorage.getItem('gotegs_student_session');
      if(raw){try{const s=JSON.parse(raw);const fresh=s.lastActivity&&(Date.now()-s.lastActivity)<(5*60*60*1000);if(fresh)window.location.replace('/student/dashboard.html');else localStorage.removeItem('gotegs_student_session');}catch(_){localStorage.removeItem('gotegs_student_session');}}

      const form=document.getElementById('loginForm'),msg=document.getElementById('loginMsg'),btn=document.getElementById('loginBtn'),setup=document.getElementById('profileSetup'),file=document.getElementById('profilePicture'),preview=document.getElementById('setupPreview'),upload=document.getElementById('uploadPicture'),skip=document.getElementById('skipPicture'),profileMsg=document.getElementById('profileMsg');
      let loginData=null;
      const goDashboard=()=>{window.location.href='/student/dashboard.html';};
      function setMessage(el,text,color){el.textContent=text;el.style.color=color;}
      function showSetup(){form.style.display='none';setup.classList.add('open');setup.querySelector('input').focus();}
      file.addEventListener('change',()=>{const chosen=file.files?.[0];if(!chosen)return;preview.src=URL.createObjectURL(chosen);setMessage(profileMsg,'','#64748b');});
      skip.addEventListener('click',()=>{if(!loginData)return;goDashboard();});
      upload.addEventListener('click',async()=>{
        if(!loginData)return;const chosen=file.files?.[0];if(!chosen){setMessage(profileMsg,'Choose a picture first.','#d97706');return;}if(chosen.size>2*1024*1024){setMessage(profileMsg,'The picture must be smaller than 2 MB.','#dc2626');return;}
        upload.disabled=true;skip.disabled=true;upload.textContent='Uploading…';setMessage(profileMsg,'Uploading your profile picture…','#64748b');
        try{
          const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',').pop());reader.onerror=()=>reject(new Error('Could not read the image.'));reader.readAsDataURL(chosen);});
          const res=await fetch('/api/student-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:loginData.student_id,pin:loginData.pin,section:loginData.section,file_name:chosen.name,mime_type:chosen.type,data})});
          const out=await res.json().catch(()=>({}));if(!res.ok)throw new Error(out.error||'Could not save the profile picture.');
          loginData.profile_pic_url=out.profile_pic_url||null;localStorage.setItem('gotegs_student_session',JSON.stringify(loginData));setMessage(profileMsg,'Saved. Opening your dashboard…','#0f766e');goDashboard();
        }catch(err){setMessage(profileMsg,err.message||'Upload failed.','#dc2626');upload.disabled=false;skip.disabled=false;upload.textContent='Upload & continue';}
      });

      form.addEventListener('submit',async(e)=>{
        e.preventDefault();const studentId=document.getElementById('studentId').value.trim(),pin=document.getElementById('pin').value;if(!studentId||!pin){setMessage(msg,'Please fill in both fields.','#d97706');return;}
        btn.disabled=true;btn.textContent='Logging in…';setMessage(msg,'','#64748b');
        try{
          const res=await fetch(`/api/student-login?student_id=${encodeURIComponent(studentId)}&pin=${encodeURIComponent(pin)}`);const data=await res.json();if(!res.ok)throw new Error(data.error||'Login failed.');
          loginData={student_id:studentId,pin,full_name:data.full_name,class:data.class,dept:data.dept,year:data.year,section:data.section,profile_pic_url:data.profile_pic_url||null,lastActivity:Date.now()};localStorage.setItem('gotegs_student_session',JSON.stringify(loginData));
          if(data.profile_pic_url||data.has_profile_pic)goDashboard();else{btn.disabled=false;btn.textContent='Log In';setMessage(msg,'Login successful. One last optional step: add a profile picture.','#0f766e');showSetup();}
        }catch(err){setMessage(msg,err.message||'Connection error.','#dc2626');btn.disabled=false;btn.textContent='Log In';}
      });
    })();
  </script>
</body>
</html>

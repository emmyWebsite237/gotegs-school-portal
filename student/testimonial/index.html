<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Leaving Testimonial | Go-Tegs International School</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/portal.css" />
  <style>
    .testimonial-coming-soon { max-width:860px; min-height:60vh; display:grid; place-items:center; }
    .testimonial-card { width:min(100%,680px); padding:2rem; text-align:center; border:1px solid #e0e5e9; border-radius:26px; background:#f3f4f5; filter:grayscale(1); box-shadow:none; }
    .testimonial-mark { width:74px; height:74px; margin:0 auto 1rem; display:grid; place-items:center; border-radius:22px; background:#b7bec5; color:#fff; font:800 1.2rem var(--font-display); }
    .testimonial-card h1 { margin:0 0 .45rem; color:#737d87; font-size:clamp(1.7rem,4vw,2.6rem); }
    .testimonial-card p { margin:0 auto; max-width:540px; color:#929aa2; font-size:.82rem; }
    .testimonial-pill { display:inline-flex; margin-top:1rem; padding:.45rem .7rem; border-radius:999px; background:#e2e5e8; color:#7e8891; font:800 .58rem var(--font-display); letter-spacing:.08em; text-transform:uppercase; }
  </style>
</head>
<body class="student-shell-page">
  <div id="navbar-placeholder"></div>
  <main class="page-container testimonial-coming-soon">
    <section class="testimonial-card" aria-labelledby="testimonialTitle">
      <div class="testimonial-mark">▣</div>
      <div class="portal-section-label" style="color:#8e979f;">Student service</div>
      <h1 id="testimonialTitle">School Leaving Testimonial</h1>
      <p>This student service is not active yet. When the school releases the testimonial feature, this space will become available from your portal.</p>
      <span class="testimonial-pill">Coming Soon · Inactive</span>
    </section>
  </main>
  <div id="footer-placeholder"></div>
  <script src="/assets/js/main.js"></script>
</body>
</html>
